services:
  - type: web
    name: backend-zvis
    runtime: node
    rootDir: backend-zvis
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false